[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-composite-oauth-gateway"
version = "0.1.0"
description = "Loopback-only multi-provider OAuth gateway for trusted Hermes Agent profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "vforge-labs" }]
dependencies = ["aiohttp>=3.9"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: Proxy Servers",
]

[project.scripts]
hermes-composite-oauth-gateway = "hermes_composite_oauth_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/vforge-labs/hermes-composite-oauth-gateway"
Repository = "https://github.com/vforge-labs/hermes-composite-oauth-gateway"
Issues = "https://github.com/vforge-labs/hermes-composite-oauth-gateway/issues"

[tool.setuptools.packages.find]
include = ["hermes_composite_oauth_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
